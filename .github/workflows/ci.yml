name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]   # проект только для Windows (КОМПАС-3D работает только там)
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -t . 2>&1 | tee unittest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # причина падения видна в аннотациях запуска без входа в GitHub
            grep -E "^(ERROR|FAIL):|Error|Exception|assert" unittest.log | head -15 | cut -c1-300 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code
      - name: Validate registry
        run: python tools/validate_registry.py
      - name: Validate mod manifests
        shell: bash
        run: |
          for d in mods/*/; do python -m mkga validate "$d"; done
      - name: Check mods do not bypass safe_io
        run: python -m mkga check mods
